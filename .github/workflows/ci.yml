name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # npm ci exige que package-lock.json esté ya sincronizado con
      # package.json. Usamos npm install hasta que el lockfile se
      # regenere localmente (ver README/PR) — luego se puede volver
      # a npm ci si se quiere una instalación más estricta/rápida.
      - run: npm install

      - run: npm run lint

      - run: npm run type-check

      - run: npm test

      - run: npm run build
